[project]
name = "orderhub-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3", "djangorestframework>=3.16,<3.17",
  "django-cors-headers>=4.7,<5", "dj-database-url>=3,<4",
  "psycopg[binary]>=3.2,<4", "celery[redis]>=5.5,<6",
  "httpx>=0.28,<0.29", "cryptography>=45", "python-dotenv>=1,<2",
  "drf-spectacular>=0.28,<1", "gunicorn>=23,<24",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "respx>=0.22,<0.23", "ruff>=0.11", "pytest-cov>=6"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
