services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orderhub
      POSTGRES_USER: orderhub
      POSTGRES_PASSWORD: orderhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orderhub]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    command: python manage.py migrate --noinput
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  celery:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  celery-beat:
    build: .
    command: celery -A config beat -l info --schedule=/tmp/celerybeat-schedule
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
volumes:
  postgres_data:
